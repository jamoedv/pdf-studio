<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Studio für Outlook</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    background: #f8fafc;
    color: #1e293b;
    font-size: 14px;
    padding: 16px;
  }
  .header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .header-icon {
    width: 28px; height: 28px; border-radius: 8px; background: #0f172a;
    display: flex; align-items: center; justify-content: center; color: white; font-size: 14px;
  }
  .header h1 { font-size: 15px; font-weight: 600; }

  .attachment-card {
    background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px;
    margin-bottom: 10px; display: flex; align-items: center; justify-content: between; gap: 10px;
    cursor: pointer; transition: border-color 0.15s;
  }
  .attachment-card.selected { border-color: #0f172a; background: #f8fafc; }
  .attachment-card:hover { border-color: #94a3b8; }
  .att-icon { width: 30px; height: 30px; border-radius: 8px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px; }
  .att-info { flex: 1; min-width: 0; }
  .att-name { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .att-size { font-size: 11px; color: #94a3b8; }
  .check { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #cbd5e1; flex-shrink: 0; }
  .attachment-card.selected .check { background: #0f172a; border-color: #0f172a; position: relative; }
  .attachment-card.selected .check::after {
    content: '✓'; color: white; font-size: 11px; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
  }

  .empty-state { text-align: center; padding: 30px 10px; color: #94a3b8; font-size: 13px; }

  .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; margin: 18px 0 8px; }

  .chat-box { background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; }
  .chat-messages { max-height: 180px; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
  .msg { font-size: 12.5px; padding: 8px 10px; border-radius: 8px; line-height: 1.4; }
  .msg.assistant { background: #f1f5f9; }
  .msg.user { background: #0f172a; color: white; margin-left: 20px; }
  .input-row { display: flex; gap: 6px; }
  .input-row input {
    flex: 1; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 10px; font-size: 12.5px; outline: none;
  }
  .input-row input:focus { border-color: #94a3b8; }
  .send-btn {
    background: #0f172a; color: white; border: none; border-radius: 8px; padding: 8px 12px;
    font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .process-btn {
    width: 100%; background: #0f172a; color: white; border: none; border-radius: 10px;
    padding: 12px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 12px;
  }
  .process-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .status { font-size: 12px; color: #64748b; margin-top: 10px; display: flex; align-items: center; gap: 6px; }
  .spinner {
    width: 13px; height: 13px; border: 2px solid #e2e8f0; border-top-color: #0f172a;
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result-box {
    background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 10px; padding: 12px; margin-top: 12px;
  }
  .result-box p { font-size: 12.5px; color: #065f46; margin-bottom: 8px; }
  .download-link {
    display: block; text-align: center; background: #0f172a; color: white; text-decoration: none;
    padding: 9px; border-radius: 8px; font-size: 12.5px; font-weight: 600; margin-bottom: 8px;
  }
  .reply-btn {
    display: block; width: 100%; text-align: center; background: white; color: #0f172a;
    border: 1px solid #cbd5e1; padding: 9px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
    cursor: pointer;
  }
  .reply-btn:hover { background: #f8fafc; }

  .error-box {
    background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 12px; margin-top: 12px;
    font-size: 12.5px; color: #b91c1c;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">📄</div>
  <h1>PDF Studio</h1>
</div>

<div class="section-label">PDF-Anhänge in dieser Mail</div>
<div id="attachmentList"></div>

<div class="section-label">Was soll passieren?</div>
<div class="chat-box">
  <div class="chat-messages" id="chatMessages">
    <div class="msg assistant">Wähle oben einen Anhang und sag mir, was ich damit tun soll — z.B. "komprimiere stark" oder "mach es durchsuchbar".</div>
  </div>
  <div class="input-row">
    <input type="text" id="chatInput" placeholder="z.B. komprimiere stark..." />
    <button class="send-btn" id="sendBtn">→</button>
  </div>
</div>

<button class="process-btn" id="processBtn" disabled>Datei verarbeiten</button>

<div id="statusArea"></div>
<div id="resultArea"></div>

<script>
  const API_URL = 'https://pdf-studio-production-4d6c.up.railway.app/api/v1';

  let attachments = [];
  let selectedAttachment = null;
  let plannedSteps = null;

  Office.onReady(() => {
    loadAttachments();
  });

  function loadAttachments() {
    const item = Office.context.mailbox.item;
    if (!item || !item.attachments) {
      document.getElementById('attachmentList').innerHTML =
        '<div class="empty-state">Keine E-Mail geöffnet.</div>';
      return;
    }

    attachments = item.attachments.filter(a =>
      a.name.toLowerCase().endsWith('.pdf') && !a.isInline
    );

    const listEl = document.getElementById('attachmentList');

    if (attachments.length === 0) {
      listEl.innerHTML = '<div class="empty-state">Keine PDF-Anhänge in dieser Mail gefunden.</div>';
      return;
    }

    listEl.innerHTML = attachments.map((att, i) => `
      <div class="attachment-card" data-index="${i}">
        <div class="att-icon">📄</div>
        <div class="att-info">
          <div class="att-name">${att.name}</div>
          <div class="att-size">${formatSize(att.size)}</div>
        </div>
        <div class="check"></div>
      </div>
    `).join('');

    listEl.querySelectorAll('.attachment-card').forEach(card => {
      card.addEventListener('click', () => selectAttachment(parseInt(card.dataset.index)));
    });
  }

  function selectAttachment(index) {
    selectedAttachment = attachments[index];
    document.querySelectorAll('.attachment-card').forEach((card, i) => {
      card.classList.toggle('selected', i === index);
    });
    updateProcessButton();
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function addMessage(role, text) {
    const el = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.textContent = text;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
  }

  function updateProcessButton() {
    const btn = document.getElementById('processBtn');
    btn.disabled = !(selectedAttachment && plannedSteps);
    btn.textContent = plannedSteps
      ? `Workflow starten (${plannedSteps.length} Schritt${plannedSteps.length > 1 ? 'e' : ''})`
      : 'Datei verarbeiten';
  }

  document.getElementById('sendBtn').addEventListener('click', sendChat);
  document.getElementById('chatInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendChat();
  });

  async function sendChat() {
    const input = document.getElementById('chatInput');
    const message = input.value.trim();
    if (!message) return;

    addMessage('user', message);
    input.value = '';

    try {
      const res = await fetch(`${API_URL}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });
      const data = await res.json();
      addMessage('assistant', data.reply);

      if (data.steps && data.steps.length > 0) {
        plannedSteps = data.steps;
      }
      updateProcessButton();
    } catch (err) {
      addMessage('assistant', 'Verbindung zum Server fehlgeschlagen.');
    }
  }

  document.getElementById('processBtn').addEventListener('click', processAttachment);

  async function processAttachment() {
    if (!selectedAttachment || !plannedSteps) return;

    const statusArea = document.getElementById('statusArea');
    const resultArea = document.getElementById('resultArea');
    resultArea.innerHTML = '';
    statusArea.innerHTML = '<div class="status"><div class="spinner"></div>Anhang wird geladen...</div>';

    try {
      const base64 = await getAttachmentBase64(selectedAttachment.id);

      statusArea.innerHTML = '<div class="status"><div class="spinner"></div>Wird verarbeitet...</div>';

      const blob = base64ToBlob(base64, 'application/pdf');
      const formData = new FormData();
      formData.append('files', blob, selectedAttachment.name);
      formData.append('steps', JSON.stringify(plannedSteps));

      const uploadRes = await fetch(`${API_URL}/workflow`, { method: 'POST', body: formData });
      if (!uploadRes.ok) throw new Error('Upload fehlgeschlagen');
      const jobData = await uploadRes.json();

      await pollJob(jobData.jobId, statusArea, resultArea);

    } catch (err) {
      statusArea.innerHTML = '';
      resultArea.innerHTML = `<div class="error-box">Fehler: ${err.message}</div>`;
    }
  }

  function getAttachmentBase64(attachmentId) {
    return new Promise((resolve, reject) => {
      Office.context.mailbox.item.getAttachmentContentAsync(attachmentId, (result) => {
        if (result.status === Office.AsyncResultStatus.Succeeded) {
          resolve(result.value.content);
        } else {
          reject(new Error('Anhang konnte nicht geladen werden'));
        }
      });
    });
  }

  function base64ToBlob(base64, mimeType) {
    const byteChars = atob(base64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) {
      byteNumbers[i] = byteChars.charCodeAt(i);
    }
    const byteArray = new Uint8Array(byteNumbers);
    return new Blob([byteArray], { type: mimeType });
  }

  function pollJob(jobId, statusArea, resultArea) {
    return new Promise((resolve, reject) => {
      const interval = setInterval(async () => {
        try {
          const res = await fetch(`${API_URL}/job/${jobId}`);
          const data = await res.json();

          if (data.status === 'completed') {
            clearInterval(interval);
            statusArea.innerHTML = '';
            showResult(data.data, resultArea);
            resolve();
          } else if (data.status === 'failed') {
            clearInterval(interval);
            statusArea.innerHTML = '';
            resultArea.innerHTML = '<div class="error-box">Verarbeitung fehlgeschlagen.</div>';
            reject(new Error('failed'));
          }
        } catch (err) {
          clearInterval(interval);
          reject(err);
        }
      }, 1500);
    });
  }

  function showResult(data, resultArea) {
    const outputPath = data.outputPath || (data.files && data.files[0]);
    if (!outputPath) {
      resultArea.innerHTML = '<div class="error-box">Kein Ergebnis erhalten.</div>';
      return;
    }
    const filename = outputPath.split('/').pop();
    const downloadUrl = `${API_URL}/download/${filename}`;

    resultArea.innerHTML = `
      <div class="result-box">
        <p>✓ Fertig verarbeitet</p>
        <a class="download-link" href="${downloadUrl}" target="_blank">Ergebnis herunterladen</a>
        <button class="reply-btn" id="replyWithResultBtn">Als Antwort mit Anhang einfügen</button>
      </div>
    `;

    document.getElementById('replyWithResultBtn').addEventListener('click', () => {
      replyWithAttachment(downloadUrl, filename);
    });
  }

  function replyWithAttachment(downloadUrl, filename) {
    Office.context.mailbox.item.displayReplyForm({
      htmlBody: '<p>Anbei das verarbeitete Dokument.</p>',
      attachments: [
        {
          type: 'file',
          name: filename,
          url: downloadUrl,
          isInline: false
        }
      ]
    });
  }
</script>

</body>
</html>
